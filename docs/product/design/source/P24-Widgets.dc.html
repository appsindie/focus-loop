<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home-screen widgets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 20px 28px; background: {{wall}}; color: {{wallInk}}; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column; gap: 10px">
  <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.75">Small · Disc and Numbers</div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
    <div style="aspect-ratio: 1; box-sizing: border-box; padding: 14px; border-radius: 24px; background: {{c.surface}}; color: {{c.ink}}; display: flex; flex-direction: column; justify-content: space-between">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <div style="width: 54px; height: 54px; border-radius: 27px; background: {{c.focus}}; box-shadow: inset 0 0 0 6px {{c.surface}}, 0 0 0 2px {{c.ink}}" aria-hidden="true"></div>
        <div style="text-align: right"><div style="font-size: 20px; font-weight: 700">4/4</div><div style="font-size: 12px; color: {{c.muted}}">days</div></div>
      </div>
      <a href="#" style="height: 44px; border-radius: 22px; background: {{c.btn}}; color: {{c.onBtn}}; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Focus 25</a>
    </div>
    <div style="aspect-ratio: 1; box-sizing: border-box; padding: 14px; border-radius: 24px; background: {{c.surface}}; color: {{c.ink}}; display: flex; flex-direction: column; justify-content: space-between">
      <div style="font-size: 13px; font-weight: 600; color: {{c.focusT}}">Focus 2 of 4</div>
      <div style="font-size: 48px; font-weight: 600; letter-spacing: -0.04em; line-height: 1">18<span style="font-size: 20px; color: {{c.faint}}"> min</span></div>
      <div style="font-size: 13px; color: {{c.muted}}">Break at 14:51</div>
    </div>
  </div>

  <div style="margin-top: 14px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.75">Medium · Next up</div>
  <div style="box-sizing: border-box; padding: 16px; border-radius: 24px; background: {{c.surface}}; color: {{c.ink}}; display: flex; gap: 16px; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-width: 0">
      <div style="font-size: 13px; color: {{c.muted}}">Waiting from last time</div>
      <div style="font-family: 'Newsreader', Georgia, serif; font-size: 22px; line-height: 1.15">Book the dentist</div>
      <div style="display: flex; gap: 3px; height: 6px; margin-top: 6px" aria-hidden="true"><div style="flex-grow: 25; background: {{c.focus}}"></div><div style="flex-grow: 5; background: {{c.brk}}"></div><div style="flex-grow: 25; background: {{c.track}}"></div><div style="flex-grow: 5; background: {{c.trackB}}"></div><div style="flex-grow: 25; background: {{c.track}}"></div><div style="flex-grow: 5; background: {{c.trackB}}"></div><div style="flex-grow: 25; background: {{c.track}}"></div><div style="flex-grow: 15; background: {{c.trackB}}"></div></div>
    </div>
    <a href="#" style="width: 88px; height: 88px; flex-shrink: 0; border-radius: 44px; background: {{c.btn}}; color: {{c.onBtn}}; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Start</a>
  </div>

  <div style="margin-top: 14px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.75">Lock screen · circular and inline</div>
  <div style="display: flex; gap: 14px; align-items: center">
    <div style="width: 64px; height: 64px; border-radius: 32px; background: {{lockChip}}; display: flex; align-items: center; justify-content: center"><div style="width: 46px; height: 46px; border-radius: 23px; background: conic-gradient({{wallInk}} 0deg 270deg, transparent 270.6deg 360deg); opacity: 0.9" aria-label="About 18 minutes left"></div></div>
    <div style="height: 64px; padding: 0 16px; border-radius: 32px; background: {{lockChip}}; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600">4 of 4 days · goal met</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg: '#F6F3EE', surface: '#FFFFFF', ink: '#141210', ink2: '#4A443C', muted: '#6B645B', faint: '#8A8175', rule: '#DDD6CB', track: '#E9DFD3', trackB: '#D3E3D8', focus: '#D9480F', focusT: '#B93C0A', brk: '#2F7D4F', brkT: '#2F7D4F', onBrk: '#FFFFFF', btn: '#141210', onBtn: '#F6F3EE', chip: '#ECE5DA', scrim: 'rgba(20,18,16,0.45)', breakBg: '#2F7D4F', accentSoft: '#F0A27F' },
      dark: { bg: '#0B0A09', surface: '#191715', ink: '#F2EEE8', ink2: '#C9C2B8', muted: '#9A9289', faint: '#7A7269', rule: '#2C2926', track: '#2A2420', trackB: '#1C2A22', focus: '#FF6A2B', focusT: '#FF8A5B', brk: '#3FA66A', brkT: '#6CC892', onBrk: '#0B0A09', btn: '#F2EEE8', onBtn: '#0B0A09', chip: '#221F1C', scrim: 'rgba(0,0,0,0.6)', breakBg: '#173D28', accentSoft: '#B93C0A' }
    };
    const dark = this.props.theme === 'dark';
    return {
      c: T[dark ? 'dark' : 'light'],
      wall: dark ? '#050505' : '#C9BBA8',
      wallInk: dark ? '#F2EEE8' : '#141210',
      lockChip: dark ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.45)'
    };
  }
}
</script>
</body>
</html>
