<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome to Plus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 96px 24px 28px; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Host Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">
  <svg width="88" height="88" viewBox="0 0 112 112" aria-hidden="true"><circle cx="56" cy="56" r="47" fill="none" stroke="{{c.ink}}" stroke-width="10"></circle><circle cx="56" cy="56" r="37" fill="{{c.focus}}"></circle></svg>
  <h1 style="margin: 28px 0 0; font-size: 40px; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em">You’re on Plus. No more ads.</h1>
  <p style="margin: 14px 0 0; font-size: 16px; line-height: 1.5; color: {{c.ink2}}">Thanks for keeping Focus Loop independent. Everything is unlocked on this phone and any device with the same store account.</p>

  <div style="margin-top: 28px; border-top: 1.5px solid {{c.ink}}">
    <a href="#" style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid {{c.rule}}; font-size: 17px; color: {{c.ink}}; text-decoration: none">Pick a disc color<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    <a href="#" style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid {{c.rule}}; font-size: 17px; color: {{c.ink}}; text-decoration: none">Choose a focus sound<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    <a href="#" style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; font-size: 17px; color: {{c.ink}}; text-decoration: none">Add a large widget<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
  </div>

  <button type="button" style="margin-top: auto; height: 60px; border: none; border-radius: 30px; background: {{c.btn}}; color: {{c.onBtn}}; font-family: inherit; font-size: 18px; font-weight: 600">Back to my loop</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg: '#F6F3EE', surface: '#FFFFFF', ink: '#141210', ink2: '#4A443C', muted: '#6B645B', faint: '#8A8175', rule: '#DDD6CB', track: '#E9DFD3', trackB: '#D3E3D8', focus: '#D9480F', focusT: '#B93C0A', brk: '#2F7D4F', brkT: '#2F7D4F', onBrk: '#FFFFFF', btn: '#141210', onBtn: '#F6F3EE', chip: '#ECE5DA', scrim: 'rgba(20,18,16,0.45)', breakBg: '#2F7D4F', accentSoft: '#F0A27F' },
      dark: { bg: '#0B0A09', surface: '#191715', ink: '#F2EEE8', ink2: '#C9C2B8', muted: '#9A9289', faint: '#7A7269', rule: '#2C2926', track: '#2A2420', trackB: '#1C2A22', focus: '#FF6A2B', focusT: '#FF8A5B', brk: '#3FA66A', brkT: '#6CC892', onBrk: '#0B0A09', btn: '#F2EEE8', onBtn: '#0B0A09', chip: '#221F1C', scrim: 'rgba(0,0,0,0.6)', breakBg: '#173D28', accentSoft: '#B93C0A' }
    };
    return { c: T[this.props.theme === 'dark' ? 'dark' : 'light'] };
  }
}
</script>
</body>
</html>
