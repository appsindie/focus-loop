<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome back — session recovered</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 72px 24px 28px; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column">
  <svg width="72" height="72" viewBox="0 0 112 112" aria-hidden="true"><circle cx="56" cy="56" r="47" fill="none" stroke="{{c.ink}}" stroke-width="10"></circle><path d="M38 57l12 12 24-26" fill="none" stroke="{{c.brk}}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path></svg>
  <h1 style="margin: 28px 0 0; font-size: 38px; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em">Welcome back. Focus 2 is done.</h1>
  <p style="margin: 14px 0 0; font-size: 16px; line-height: 1.5; color: {{c.ink2}}">It ended at 14:51 while the app was closed, and it’s saved. Phones sometimes close apps in the background; your time still counts.</p>

  <div style="margin-top: 24px; padding: 16px 0; border-top: 1px solid {{c.rule}}; border-bottom: 1px solid {{c.rule}}; display: flex; justify-content: space-between; font-size: 15px">
    <span style="font-family: 'Newsreader', Georgia, serif; font-size: 19px">Draft the intro for the Q4 report</span>
    <span style="color: {{c.muted}}">25 min</span>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 60px; border: none; border-radius: 30px; background: {{c.btn}}; color: {{c.onBtn}}; font-family: inherit; font-size: 18px; font-weight: 600">How did it go?</button>
    <button type="button" style="height: 52px; border-radius: 26px; border: 1.5px solid {{c.rule}}; background: transparent; color: {{c.ink}}; font-family: inherit; font-size: 16px">Skip to break</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg: '#F6F3EE', surface: '#FFFFFF', ink: '#141210', ink2: '#4A443C', muted: '#6B645B', faint: '#8A8175', rule: '#DDD6CB', track: '#E9DFD3', trackB: '#D3E3D8', focus: '#D9480F', focusT: '#B93C0A', brk: '#2F7D4F', brkT: '#2F7D4F', onBrk: '#FFFFFF', btn: '#141210', onBtn: '#F6F3EE', chip: '#ECE5DA', scrim: 'rgba(20,18,16,0.45)', breakBg: '#2F7D4F', accentSoft: '#F0A27F' },
      dark: { bg: '#0B0A09', surface: '#191715', ink: '#F2EEE8', ink2: '#C9C2B8', muted: '#9A9289', faint: '#7A7269', rule: '#2C2926', track: '#2A2420', trackB: '#1C2A22', focus: '#FF6A2B', focusT: '#FF8A5B', brk: '#3FA66A', brkT: '#6CC892', onBrk: '#0B0A09', btn: '#F2EEE8', onBtn: '#0B0A09', chip: '#221F1C', scrim: 'rgba(0,0,0,0.6)', breakBg: '#173D28', accentSoft: '#B93C0A' }
    };
    return { c: T[this.props.theme === 'dark' ? 'dark' : 'light'] };
  }
}
</script>
</body>
</html>
