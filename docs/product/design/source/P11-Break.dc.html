<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Break</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 24px 28px; background: {{c.breakBg}}; color: #FFFFFF; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase">
    <div>Break</div>
    <div style="color: #CFE5D7">then Focus 3</div>
  </div>

  <div style="margin-top: 40px; display: flex; justify-content: center">
    <div role="img" aria-label="About 4 minutes of rest left" style="width: 240px; height: 240px; border-radius: 120px; background: conic-gradient(#FFFFFF 0deg 274deg, rgba(255,255,255,0.18) 274deg 360deg)"></div>
  </div>
  <div style="margin-top: 20px; text-align: center; font-size: 20px; font-weight: 500">about 4 min of rest</div>

  <div style="margin-top: 36px; font-size: 13px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #CFE5D7">Off the screen</div>
  <div style="margin-top: 8px; border-top: 1.5px solid #FFFFFF">
    <div style="height: 48px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.28); font-size: 17px">Stand up, stretch your back</div>
    <div style="height: 48px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.28); font-size: 17px">Refill your water</div>
    <div style="height: 48px; display: flex; align-items: center; font-size: 17px">Look at something far away</div>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 2fr; gap: 12px">
    <button type="button" style="height: 56px; border-radius: 28px; border: 1.5px solid #FFFFFF; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600">+5 min</button>
    <button type="button" style="height: 56px; border-radius: 28px; border: none; background: #FFFFFF; color: #173D28; font-family: inherit; font-size: 17px; font-weight: 600">Focus 3 now</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg: '#F6F3EE', surface: '#FFFFFF', ink: '#141210', ink2: '#4A443C', muted: '#6B645B', faint: '#8A8175', rule: '#DDD6CB', track: '#E9DFD3', trackB: '#D3E3D8', focus: '#D9480F', focusT: '#B93C0A', brk: '#2F7D4F', brkT: '#2F7D4F', onBrk: '#FFFFFF', btn: '#141210', onBtn: '#F6F3EE', chip: '#ECE5DA', scrim: 'rgba(20,18,16,0.45)', breakBg: '#2F7D4F', accentSoft: '#F0A27F' },
      dark: { bg: '#0B0A09', surface: '#191715', ink: '#F2EEE8', ink2: '#C9C2B8', muted: '#9A9289', faint: '#7A7269', rule: '#2C2926', track: '#2A2420', trackB: '#1C2A22', focus: '#FF6A2B', focusT: '#FF8A5B', brk: '#3FA66A', brkT: '#6CC892', onBrk: '#0B0A09', btn: '#F2EEE8', onBtn: '#0B0A09', chip: '#221F1C', scrim: 'rgba(0,0,0,0.6)', breakBg: '#173D28', accentSoft: '#B93C0A' }
    };
    return { c: T[this.props.theme === 'dark' ? 'dark' : 'light'] };
  }
}
</script>
</body>
</html>
