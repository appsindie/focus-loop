<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notification pre-prompt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 72px 24px 28px; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column">
  <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: {{c.brkT}}">First session done</div>
  <h1 style="margin: 14px 0 0; font-size: 38px; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em">Want a tap on the shoulder when it’s time?</h1>
  <p style="margin: 14px 0 0; font-size: 16px; line-height: 1.5; color: {{c.ink2}}">We only send three kinds of notifications. You can turn each one off.</p>

  <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 10px">
    <div style="padding: 14px 16px; border-radius: 18px; background: {{c.surface}}; display: flex; gap: 12px; align-items: center">
      <svg width="36" height="36" viewBox="0 0 112 112" aria-hidden="true"><rect width="112" height="112" rx="26" fill="#141210"></rect><circle cx="56" cy="56" r="33" fill="none" stroke="#F6F3EE" stroke-width="7"></circle><path d="M56 56 L56 30 A26 26 0 1 1 30 56 Z" fill="#FF6A2B"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 600">Break time</div><div style="font-size: 14px; color: {{c.ink2}}">Focus 1 is done. Stand up for 5 minutes.</div></div>
    </div>
    <div style="padding: 14px 16px; border-radius: 18px; background: {{c.surface}}; display: flex; gap: 12px; align-items: center">
      <svg width="36" height="36" viewBox="0 0 112 112" aria-hidden="true"><rect width="112" height="112" rx="26" fill="#141210"></rect><circle cx="56" cy="56" r="33" fill="none" stroke="#F6F3EE" stroke-width="7"></circle><path d="M56 56 L56 30 A26 26 0 1 1 30 56 Z" fill="#FF6A2B"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 600">Back to it</div><div style="font-size: 14px; color: {{c.ink2}}">Break’s over. Focus 2 is ready.</div></div>
    </div>
    <div style="padding: 14px 16px; border-radius: 18px; background: {{c.surface}}; display: flex; gap: 12px; align-items: center">
      <svg width="36" height="36" viewBox="0 0 112 112" aria-hidden="true"><rect width="112" height="112" rx="26" fill="#141210"></rect><circle cx="56" cy="56" r="33" fill="none" stroke="#F6F3EE" stroke-width="7"></circle><path d="M56 56 L56 30 A26 26 0 1 1 30 56 Z" fill="#FF6A2B"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 600">Your planned focus</div><div style="font-size: 14px; color: {{c.ink2}}">Only if you set a reminder.</div></div>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
    <button type="button" style="height: 60px; border: none; border-radius: 30px; background: {{c.btn}}; color: {{c.onBtn}}; font-family: inherit; font-size: 18px; font-weight: 600">Turn on notifications</button>
    <button type="button" style="height: 48px; border: none; background: transparent; color: {{c.ink2}}; font-family: inherit; font-size: 16px">Not now</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg: '#F6F3EE', surface: '#FFFFFF', ink: '#141210', ink2: '#4A443C', muted: '#6B645B', faint: '#8A8175', rule: '#DDD6CB', track: '#E9DFD3', trackB: '#D3E3D8', focus: '#D9480F', focusT: '#B93C0A', brk: '#2F7D4F', brkT: '#2F7D4F', onBrk: '#FFFFFF', btn: '#141210', onBtn: '#F6F3EE', chip: '#ECE5DA', scrim: 'rgba(20,18,16,0.45)', breakBg: '#2F7D4F', accentSoft: '#F0A27F' },
      dark: { bg: '#0B0A09', surface: '#191715', ink: '#F2EEE8', ink2: '#C9C2B8', muted: '#9A9289', faint: '#7A7269', rule: '#2C2926', track: '#2A2420', trackB: '#1C2A22', focus: '#FF6A2B', focusT: '#FF8A5B', brk: '#3FA66A', brkT: '#6CC892', onBrk: '#0B0A09', btn: '#F2EEE8', onBtn: '#0B0A09', chip: '#221F1C', scrim: 'rgba(0,0,0,0.6)', breakBg: '#173D28', accentSoft: '#B93C0A' }
    };
    return { c: T[this.props.theme === 'dark' ? 'dark' : 'light'] };
  }
}
</script>
</body>
</html>
