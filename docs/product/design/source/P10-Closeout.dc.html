<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session close-out</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 24px 28px; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column">
  <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: {{c.focusT}}">Focus 2 done · 25 min</div>
  <div style="margin-top: 10px; font-family: 'Newsreader', Georgia, serif; font-size: 22px; line-height: 1.2; color: {{c.ink2}}">Draft the intro for the Q4 report</div>
  <h1 style="margin: 28px 0 0; font-size: 38px; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em">How did it go?</h1>

  <div role="radiogroup" aria-label="Outcome" style="margin-top: 18px; border-top: 1.5px solid {{c.ink}}">
    <button type="button" aria-pressed="false" style="width: 100%; min-height: 60px; padding: 0; border: none; border-bottom: 1px solid {{c.rule}}; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; font-family: inherit; color: {{c.ink}}"><span style="width: 20px; height: 20px; border-radius: 10px; border: 1.5px solid {{c.faint}}; box-sizing: border-box"></span><span style="font-size: 18px">Finished it</span></button>
    <button type="button" aria-pressed="true" style="width: 100%; min-height: 60px; padding: 0; border: none; border-bottom: 1px solid {{c.rule}}; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; font-family: inherit; color: {{c.ink}}"><span style="width: 20px; height: 20px; border-radius: 10px; border: 6px solid {{c.ink}}; box-sizing: border-box"></span><span style="font-size: 18px; font-weight: 600">Moved it forward</span></button>
    <button type="button" aria-pressed="false" style="width: 100%; min-height: 60px; padding: 0; border: none; border-bottom: 1px solid {{c.rule}}; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; font-family: inherit; color: {{c.ink}}"><span style="width: 20px; height: 20px; border-radius: 10px; border: 1.5px solid {{c.faint}}; box-sizing: border-box"></span><span style="font-size: 18px">Got stuck</span><span style="margin-left: auto; font-size: 14px; color: {{c.muted}}">still counts</span></button>
  </div>

  <div style="margin-top: 20px; font-size: 15px; line-height: 1.5; color: {{c.ink2}}">1 parked thought waits for you on Home.</div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <label style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; font-size: 16px">Start breaks automatically<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: {{c.brk}}"></label>
    <button type="button" style="height: 64px; border: none; border-radius: 32px; background: {{c.brk}}; color: {{c.onBrk}}; font-family: inherit; font-size: 19px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; padding: 0 26px"><span>Start break</span><span style="font-weight: 500">5:00</span></button>
    <button type="button" style="height: 48px; border: none; background: transparent; color: {{c.ink2}}; font-family: inherit; font-size: 16px">Keep going, 10 more minutes</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg: '#F6F3EE', surface: '#FFFFFF', ink: '#141210', ink2: '#4A443C', muted: '#6B645B', faint: '#8A8175', rule: '#DDD6CB', track: '#E9DFD3', trackB: '#D3E3D8', focus: '#D9480F', focusT: '#B93C0A', brk: '#2F7D4F', brkT: '#2F7D4F', onBrk: '#FFFFFF', btn: '#141210', onBtn: '#F6F3EE', chip: '#ECE5DA', scrim: 'rgba(20,18,16,0.45)', breakBg: '#2F7D4F', accentSoft: '#F0A27F' },
      dark: { bg: '#0B0A09', surface: '#191715', ink: '#F2EEE8', ink2: '#C9C2B8', muted: '#9A9289', faint: '#7A7269', rule: '#2C2926', track: '#2A2420', trackB: '#1C2A22', focus: '#FF6A2B', focusT: '#FF8A5B', brk: '#3FA66A', brkT: '#6CC892', onBrk: '#0B0A09', btn: '#F2EEE8', onBtn: '#0B0A09', chip: '#221F1C', scrim: 'rgba(0,0,0,0.6)', breakBg: '#173D28', accentSoft: '#B93C0A' }
    };
    return { c: T[this.props.theme === 'dark' ? 'dark' : 'light'] };
  }
}
</script>
</body>
</html>
