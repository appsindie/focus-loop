<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tablet — Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1194px; height: 834px; box-sizing: border-box; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: grid; grid-template-columns: 360px minmax(0, 1fr)">
  <nav aria-label="Settings sections" style="padding: 32px 24px; border-right: 1px solid {{c.rule}}; display: flex; flex-direction: column">
    <h1 style="margin: 0 0 20px; font-size: 32px; font-weight: 600; letter-spacing: -0.03em">Settings</h1>
    <a href="#" aria-current="page" style="min-height: 52px; padding: 0 14px; border-radius: 12px; background: {{c.surface}}; display: flex; align-items: center; font-size: 17px; font-weight: 600; color: {{c.ink}}; text-decoration: none">Timer &amp; display</a>
    <a href="#" style="min-height: 52px; padding: 0 14px; display: flex; align-items: center; font-size: 17px; color: {{c.ink}}; text-decoration: none">Themes &amp; sounds</a>
    <a href="#" style="min-height: 52px; padding: 0 14px; display: flex; align-items: center; font-size: 17px; color: {{c.ink}}; text-decoration: none">Reminders</a>
    <a href="#" style="min-height: 52px; padding: 0 14px; display: flex; align-items: center; font-size: 17px; color: {{c.ink}}; text-decoration: none">Focus Loop Plus</a>
    <a href="#" style="min-height: 52px; padding: 0 14px; display: flex; align-items: center; font-size: 17px; color: {{c.ink}}; text-decoration: none">Your data</a>
    <a href="#" style="min-height: 52px; padding: 0 14px; display: flex; align-items: center; font-size: 17px; color: {{c.ink}}; text-decoration: none">About &amp; legal</a>
    <div style="margin-top: auto; font-size: 13px; line-height: 1.6; color: {{c.muted}}">Version [x.y.z] (build [n])</div>
  </nav>
  <div style="padding: 40px 56px; display: flex; flex-direction: column">
    <h2 style="margin: 0; font-size: 28px; font-weight: 600">Timer &amp; display</h2>
    <div style="margin-top: 4px; font-size: 14px; color: {{c.muted}}">Changes save as you go.</div>
    <div style="margin-top: 24px; font-size: 13px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: {{c.muted}}">Show time as</div>
    <div role="radiogroup" aria-label="Show time as" style="margin-top: 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 560px">
      <button type="button" aria-pressed="true" style="height: 72px; border: 2px solid {{c.ink}}; border-radius: 14px; background: {{c.surface}}; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: inherit; font-size: 17px; font-weight: 600; color: {{c.ink}}"><span style="width: 28px; height: 28px; border-radius: 14px; background: conic-gradient({{c.focus}} 0deg 240deg, {{c.track}} 240.6deg 360deg)" aria-hidden="true"></span>Disc</button>
      <button type="button" aria-pressed="false" style="height: 72px; border: 1px solid {{c.rule}}; border-radius: 14px; background: {{c.surface}}; font-family: inherit; font-size: 17px; color: {{c.ink}}"><span aria-hidden="true" style="font-weight: 700; margin-right: 8px">12:34</span>Numbers</button>
    </div>
    <div style="margin-top: 22px; font-size: 13px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: {{c.muted}}">Appearance</div>
    <div role="radiogroup" aria-label="Appearance" style="margin-top: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 2px; border-radius: 24px; background: {{c.chip}}; max-width: 560px">
      <button type="button" aria-pressed="false" style="height: 44px; border: none; border-radius: 22px; background: transparent; font-family: inherit; font-size: 15px; color: {{c.ink2}}">Light</button>
      <button type="button" aria-pressed="false" style="height: 44px; border: none; border-radius: 22px; background: transparent; font-family: inherit; font-size: 15px; color: {{c.ink2}}">Dark</button>
      <button type="button" aria-pressed="true" style="height: 44px; border: none; border-radius: 22px; background: {{c.surface}}; font-family: inherit; font-size: 15px; font-weight: 600; color: {{c.ink}}">System</button>
    </div>
    <div style="margin-top: 26px; border-top: 1.5px solid {{c.ink}}; max-width: 720px">
      <a href="#" style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid {{c.rule}}; font-size: 17px; color: {{c.ink}}; text-decoration: none"><span>Rhythm</span><span style="color: {{c.ink2}}">25 · 5 · long 15</span></a>
      <a href="#" style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid {{c.rule}}; font-size: 17px; color: {{c.ink}}; text-decoration: none"><span>Weekly goal</span><span style="color: {{c.ink2}}">4 days</span></a>
      <label style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid {{c.rule}}; font-size: 17px">Start breaks automatically<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: {{c.ink}}"></label>
      <label style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid {{c.rule}}; font-size: 17px">Show seconds<input type="checkbox" style="width: 22px; height: 22px; accent-color: {{c.ink}}"></label>
      <label style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; font-size: 17px">Keep screen on during focus<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: {{c.ink}}"></label>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg: '#F6F3EE', surface: '#FFFFFF', ink: '#141210', ink2: '#4A443C', muted: '#6B645B', faint: '#8A8175', rule: '#DDD6CB', track: '#E9DFD3', trackB: '#D3E3D8', focus: '#D9480F', focusT: '#B93C0A', brk: '#2F7D4F', brkT: '#2F7D4F', onBrk: '#FFFFFF', btn: '#141210', onBtn: '#F6F3EE', chip: '#ECE5DA', scrim: 'rgba(20,18,16,0.45)', breakBg: '#2F7D4F', accentSoft: '#F0A27F' },
      dark: { bg: '#0B0A09', surface: '#191715', ink: '#F2EEE8', ink2: '#C9C2B8', muted: '#9A9289', faint: '#7A7269', rule: '#2C2926', track: '#2A2420', trackB: '#1C2A22', focus: '#FF6A2B', focusT: '#FF8A5B', brk: '#3FA66A', brkT: '#6CC892', onBrk: '#0B0A09', btn: '#F2EEE8', onBtn: '#0B0A09', chip: '#221F1C', scrim: 'rgba(0,0,0,0.6)', breakBg: '#173D28', accentSoft: '#B93C0A' }
    };
    return { c: T[this.props.theme === 'dark' ? 'dark' : 'light'] };
  }
}
</script>
</body>
</html>
