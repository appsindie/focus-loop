<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock screen — Live Activity and notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 14px 28px; background: {{wall}}; color: {{wallInk}}; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column; align-items: center">
  <div style="font-size: 17px; font-weight: 500; opacity: 0.85">Thursday 2 October</div>
  <div style="font-size: 88px; font-weight: 600; letter-spacing: -0.04em; line-height: 1">14:32</div>

  <div style="margin-top: 26px; width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 22px; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; gap: 14px">
    <div style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; background: conic-gradient({{c.focus}} 0deg 270deg, {{c.track}} 270.6deg 360deg)" aria-hidden="true"></div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
      <div style="font-size: 16px; font-weight: 600">Draft the intro for the Q4 report</div>
      <div style="font-size: 14px; color: {{c.ink2}}">about 18 min · Focus 2 of 4</div>
    </div>
    <button type="button" aria-label="Pause" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: none; background: {{c.chip}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
  </div>
  <div style="margin-top: 6px; align-self: flex-start; padding-left: 6px; font-size: 12px; opacity: 0.7">Live Activity · Disc mode</div>

  <div style="margin-top: 14px; width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 22px; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 16px; font-weight: 600">Focus 2 of 4</div><div style="font-size: 14px; color: {{c.ink2}}">Break at 14:51</div></div>
    <div style="font-size: 40px; font-weight: 600; letter-spacing: -0.03em; color: {{c.focusT}}">18:42</div>
  </div>
  <div style="margin-top: 6px; align-self: flex-start; padding-left: 6px; font-size: 12px; opacity: 0.7">Live Activity · Numbers mode</div>

  <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 8px">
    <div style="padding: 12px 14px; border-radius: 20px; background: {{notif}}; color: {{c.ink}}; display: flex; gap: 12px; align-items: center">
      <svg width="36" height="36" viewBox="0 0 112 112" aria-hidden="true"><rect width="112" height="112" rx="26" fill="#141210"></rect><circle cx="56" cy="56" r="33" fill="none" stroke="#F6F3EE" stroke-width="7"></circle><path d="M56 56 L56 30 A26 26 0 1 1 30 56 Z" fill="#FF6A2B"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">Break time</span><span style="color: {{c.muted}}">13:51</span></div><div style="font-size: 14px; color: {{c.ink2}}">Focus 1 is done. Stand up for 5 minutes.</div></div>
    </div>
    <div style="padding: 12px 14px; border-radius: 20px; background: {{notif}}; color: {{c.ink}}; display: flex; gap: 12px; align-items: center">
      <svg width="36" height="36" viewBox="0 0 112 112" aria-hidden="true"><rect width="112" height="112" rx="26" fill="#141210"></rect><circle cx="56" cy="56" r="33" fill="none" stroke="#F6F3EE" stroke-width="7"></circle><path d="M56 56 L56 30 A26 26 0 1 1 30 56 Z" fill="#FF6A2B"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">Time to focus</span><span style="color: {{c.muted}}">09:00</span></div><div style="font-size: 14px; color: {{c.ink2}}">Your 9:00 block. Tap to start 25 minutes.</div></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg: '#F6F3EE', surface: '#FFFFFF', ink: '#141210', ink2: '#4A443C', muted: '#6B645B', faint: '#8A8175', rule: '#DDD6CB', track: '#E9DFD3', trackB: '#D3E3D8', focus: '#D9480F', focusT: '#B93C0A', brk: '#2F7D4F', brkT: '#2F7D4F', onBrk: '#FFFFFF', btn: '#141210', onBtn: '#F6F3EE', chip: '#ECE5DA', scrim: 'rgba(20,18,16,0.45)', breakBg: '#2F7D4F', accentSoft: '#F0A27F' },
      dark: { bg: '#0B0A09', surface: '#191715', ink: '#F2EEE8', ink2: '#C9C2B8', muted: '#9A9289', faint: '#7A7269', rule: '#2C2926', track: '#2A2420', trackB: '#1C2A22', focus: '#FF6A2B', focusT: '#FF8A5B', brk: '#3FA66A', brkT: '#6CC892', onBrk: '#0B0A09', btn: '#F2EEE8', onBtn: '#0B0A09', chip: '#221F1C', scrim: 'rgba(0,0,0,0.6)', breakBg: '#173D28', accentSoft: '#B93C0A' }
    };
    const dark = this.props.theme === 'dark';
    return {
      c: T[dark ? 'dark' : 'light'],
      wall: dark ? '#050505' : '#C9BBA8',
      wallInk: dark ? '#F2EEE8' : '#141210',
      notif: dark ? 'rgba(40,37,34,0.92)' : 'rgba(255,255,255,0.86)'
    };
  }
}
</script>
</body>
</html>
