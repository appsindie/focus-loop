<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share your week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 24px 28px; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column; align-items: center">
  <div style="width: 100%; display: flex; justify-content: space-between; align-items: center">
    <button type="button" aria-label="Close" style="width: 44px; height: 44px; margin-left: -10px; border: none; background: transparent; color: {{c.ink}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <div style="font-size: 17px; font-weight: 600">Share your week</div>
    <div style="width: 44px"></div>
  </div>

  <div style="margin-top: 16px; width: 270px; height: 480px; box-sizing: border-box; padding: 28px 24px; border-radius: 18px; background: #141210; box-shadow: 0 0 0 1px {{c.rule}}; color: #F6F3EE; display: flex; flex-direction: column" aria-label="Preview: 275 minutes over 4 days, 5 finished, 6 moved forward">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A39B90">My focus week</div>
    <div style="margin-top: 20px; font-size: 84px; line-height: 0.85; font-weight: 600; letter-spacing: -0.06em">275</div>
    <div style="margin-top: 8px; font-size: 15px; color: #D8D0C2">minutes, 4 days</div>
    <div style="margin-top: 26px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; align-items: end; height: 62px">
      <div style="height: 25px; background: #D9480F"></div><div style="height: 50px; background: #D9480F"></div><div style="height: 12px; background: #D9480F"></div><div style="height: 50px; background: #D9480F"></div><div style="height: 3px; background: #3A3631"></div><div style="height: 3px; background: #3A3631"></div><div style="height: 3px; background: #3A3631"></div>
    </div>
    <div style="margin-top: 26px; font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 19px; line-height: 1.2">5 things finished.<br>6 moved forward.</div>
    <div style="margin-top: auto; padding-top: 12px; border-top: 1px solid #3A3631; display: flex; justify-content: space-between; align-items: center; font-size: 12px"><span style="font-weight: 600">Focus Loop</span><span style="color: #A39B90">No account. Free.</span></div>
  </div>

  <div role="radiogroup" aria-label="Card style" style="margin-top: 18px; display: flex; gap: 10px">
    <button type="button" aria-pressed="true" aria-label="Ink" style="width: 44px; height: 44px; border-radius: 22px; border: 3px solid {{c.ink}}; padding: 4px; background: transparent"><span style="display: block; width: 100%; height: 100%; border-radius: 50%; background: #141210"></span></button>
    <button type="button" aria-pressed="false" aria-label="Paper" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.rule}}; padding: 6px; background: transparent"><span style="display: block; width: 100%; height: 100%; border-radius: 50%; background: #F6F3EE; box-shadow: inset 0 0 0 1px #DDD6CB"></span></button>
    <button type="button" aria-pressed="false" aria-label="Ember" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.rule}}; padding: 6px; background: transparent"><span style="display: block; width: 100%; height: 100%; border-radius: 50%; background: #D9480F"></span></button>
  </div>
  <label style="margin-top: 12px; min-height: 44px; display: flex; align-items: center; gap: 10px; font-size: 15px; color: {{c.ink2}}"><input type="checkbox" style="width: 20px; height: 20px; accent-color: {{c.ink}}">Show what I worked on</label>

  <button type="button" style="margin-top: auto; width: 100%; height: 60px; border: none; border-radius: 30px; background: {{c.btn}}; color: {{c.onBtn}}; font-family: inherit; font-size: 18px; font-weight: 600">Share image</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg: '#F6F3EE', surface: '#FFFFFF', ink: '#141210', ink2: '#4A443C', muted: '#6B645B', faint: '#8A8175', rule: '#DDD6CB', track: '#E9DFD3', trackB: '#D3E3D8', focus: '#D9480F', focusT: '#B93C0A', brk: '#2F7D4F', brkT: '#2F7D4F', onBrk: '#FFFFFF', btn: '#141210', onBtn: '#F6F3EE', chip: '#ECE5DA', scrim: 'rgba(20,18,16,0.45)', breakBg: '#2F7D4F', accentSoft: '#F0A27F' },
      dark: { bg: '#0B0A09', surface: '#191715', ink: '#F2EEE8', ink2: '#C9C2B8', muted: '#9A9289', faint: '#7A7269', rule: '#2C2926', track: '#2A2420', trackB: '#1C2A22', focus: '#FF6A2B', focusT: '#FF8A5B', brk: '#3FA66A', brkT: '#6CC892', onBrk: '#0B0A09', btn: '#F2EEE8', onBtn: '#0B0A09', chip: '#221F1C', scrim: 'rgba(0,0,0,0.6)', breakBg: '#173D28', accentSoft: '#B93C0A' }
    };
    return { c: T[this.props.theme === 'dark' ? 'dark' : 'light'] };
  }
}
</script>
</body>
</html>
