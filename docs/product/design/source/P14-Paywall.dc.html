<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus Loop Plus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 24px 24px; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: flex-end">
    <button type="button" aria-label="Close" style="width: 44px; height: 44px; border: none; background: transparent; color: {{c.ink}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>

  <div style="margin-top: 12px; font-size: 14px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: {{c.focusT}}">Focus Loop Plus</div>
  <h1 style="margin: 10px 0 0; font-size: 36px; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em">You just did a full loop. Keep it quiet.</h1>

  <div style="margin-top: 24px; border-top: 1.5px solid {{c.ink}}">
    <div style="min-height: 50px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{c.rule}}; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.brkT}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"></path></svg>No ads, ever</div>
    <div style="min-height: 50px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{c.rule}}; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.brkT}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"></path></svg>Focus sounds: brown noise, rain, café</div>
    <div style="min-height: 50px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{c.rule}}; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.brkT}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"></path></svg>Every disc color and theme</div>
    <div style="min-height: 50px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{c.rule}}; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.brkT}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"></path></svg>Full history and notes, not just 7 days</div>
    <div style="min-height: 50px; display: flex; align-items: center; gap: 12px; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.brkT}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"></path></svg>Extra widget styles</div>
  </div>

  <div role="radiogroup" aria-label="Plan" style="margin-top: 22px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button type="button" aria-pressed="true" style="height: 96px; border: 2px solid {{c.ink}}; border-radius: 16px; background: {{c.surface}}; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 0 16px; font-family: inherit; color: {{c.ink}}"><span style="font-size: 15px; font-weight: 600">Yearly</span><span style="font-size: 20px; font-weight: 600">[PRICE]</span><span style="font-size: 13px; color: {{c.ink2}}">7-day free trial</span></button>
    <button type="button" aria-pressed="false" style="height: 96px; border: 1px solid {{c.rule}}; border-radius: 16px; background: {{c.surface}}; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 0 16px; font-family: inherit; color: {{c.ink}}"><span style="font-size: 15px; font-weight: 600">Lifetime</span><span style="font-size: 20px; font-weight: 600">[PRICE]</span><span style="font-size: 13px; color: {{c.ink2}}">Pay once</span></button>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
    <button type="button" style="height: 60px; border: none; border-radius: 30px; background: {{c.btn}}; color: {{c.onBtn}}; font-family: inherit; font-size: 18px; font-weight: 600">Start free trial</button>
    <div style="text-align: center; font-size: 12px; line-height: 1.5; color: {{c.muted}}">Free for 7 days, then [PRICE] per year. Cancel anytime in your store settings.</div>
    <div style="display: flex; justify-content: center; gap: 20px; font-size: 13px"><a href="#" style="min-height: 44px; display: flex; align-items: center; color: {{c.muted}}">Restore</a><a href="#" style="min-height: 44px; display: flex; align-items: center; color: {{c.muted}}">Terms</a><a href="#" style="min-height: 44px; display: flex; align-items: center; color: {{c.muted}}">Privacy</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg: '#F6F3EE', surface: '#FFFFFF', ink: '#141210', ink2: '#4A443C', muted: '#6B645B', faint: '#8A8175', rule: '#DDD6CB', track: '#E9DFD3', trackB: '#D3E3D8', focus: '#D9480F', focusT: '#B93C0A', brk: '#2F7D4F', brkT: '#2F7D4F', onBrk: '#FFFFFF', btn: '#141210', onBtn: '#F6F3EE', chip: '#ECE5DA', scrim: 'rgba(20,18,16,0.45)', breakBg: '#2F7D4F', accentSoft: '#F0A27F' },
      dark: { bg: '#0B0A09', surface: '#191715', ink: '#F2EEE8', ink2: '#C9C2B8', muted: '#9A9289', faint: '#7A7269', rule: '#2C2926', track: '#2A2420', trackB: '#1C2A22', focus: '#FF6A2B', focusT: '#FF8A5B', brk: '#3FA66A', brkT: '#6CC892', onBrk: '#0B0A09', btn: '#F2EEE8', onBtn: '#0B0A09', chip: '#221F1C', scrim: 'rgba(0,0,0,0.6)', breakBg: '#173D28', accentSoft: '#B93C0A' }
    };
    return { c: T[this.props.theme === 'dark' ? 'dark' : 'light'] };
  }
}
</script>
</body>
</html>
