<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tablet — Focus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1194px; height: 834px; box-sizing: border-box; padding: 40px 48px 36px; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: grid; grid-template-columns: 560px minmax(0, 1fr); column-gap: 64px">
  <div style="display: flex; align-items: center; justify-content: center">
    <div role="img" aria-label="About 18 minutes left" style="width: 540px; height: 540px; border-radius: 270px; background: conic-gradient({{c.focus}} 0deg 269deg, {{c.track}} 269.6deg 360deg)"></div>
  </div>
  <div style="display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 15px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: {{c.focusT}}">Focus 2 of 4</div>
      <div role="group" aria-label="Display" style="display: flex; padding: 2px; border-radius: 24px; background: {{c.chip}}">
        <button type="button" aria-label="Show time as a disc" aria-pressed="true" style="width: 56px; height: 44px; border: none; border-radius: 22px; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M10 10V1.5A8.5 8.5 0 0 1 18.1 12.6z" fill="currentColor"></path></svg></button>
        <button type="button" aria-label="Show time as numbers" aria-pressed="false" style="width: 56px; height: 44px; border: none; border-radius: 22px; background: transparent; color: {{c.ink}}; font-family: inherit; font-size: 14px; font-weight: 700">12:34</button>
      </div>
    </div>
    <div style="margin-top: 32px; font-family: 'Newsreader', Georgia, serif; font-size: 40px; line-height: 1.1">Draft the intro for the Q4 report</div>
    <div style="margin-top: 20px; font-size: 22px; color: {{c.ink2}}">about 18 min left · ends 14:51</div>
    <div style="margin-top: 28px">
      <div style="display: flex; gap: 4px; height: 10px" aria-hidden="true">
        <div style="flex-grow: 25; background: {{c.focus}}"></div><div style="flex-grow: 5; background: {{c.brk}}"></div><div style="flex-grow: 25; background: {{c.track}}"><div style="width: 25%; height: 10px; background: {{c.focus}}"></div></div><div style="flex-grow: 5; background: {{c.trackB}}"></div><div style="flex-grow: 25; background: {{c.track}}"></div><div style="flex-grow: 5; background: {{c.trackB}}"></div><div style="flex-grow: 25; background: {{c.track}}"></div><div style="flex-grow: 15; background: {{c.trackB}}"></div>
      </div>
      <div style="margin-top: 10px; font-size: 14px; color: {{c.muted}}">Next: 5 min break</div>
    </div>

    <div style="margin-top: 32px; font-size: 13px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: {{c.muted}}">Later, not now</div>
    <div style="margin-top: 6px; border-top: 1px solid {{c.rule}}">
      <div style="padding: 10px 0; border-bottom: 1px solid {{c.rule}}; font-family: 'Newsreader', Georgia, serif; font-size: 20px; color: {{c.ink2}}">Check Minh’s invoice</div>
      <label for="t-park" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Park a thought</label>
      <input id="t-park" type="text" placeholder="Park a thought…" style="width: 100%; height: 52px; padding: 0; border: none; border-bottom: 1px solid {{c.rule}}; background: transparent; font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 20px; color: {{c.ink}}">
    </div>

    <div style="margin-top: auto; display: flex; gap: 16px">
      <button type="button" style="width: 200px; height: 60px; border-radius: 30px; border: 1.5px solid {{c.ink}}; background: transparent; color: {{c.ink}}; font-family: inherit; font-size: 18px; font-weight: 600">Pause</button>
      <button type="button" style="height: 60px; padding: 0 20px; border: none; background: transparent; color: {{c.muted}}; font-family: inherit; font-size: 18px">End early…</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg: '#F6F3EE', surface: '#FFFFFF', ink: '#141210', ink2: '#4A443C', muted: '#6B645B', faint: '#8A8175', rule: '#DDD6CB', track: '#E9DFD3', trackB: '#D3E3D8', focus: '#D9480F', focusT: '#B93C0A', brk: '#2F7D4F', brkT: '#2F7D4F', onBrk: '#FFFFFF', btn: '#141210', onBtn: '#F6F3EE', chip: '#ECE5DA', scrim: 'rgba(20,18,16,0.45)', breakBg: '#2F7D4F', accentSoft: '#F0A27F' },
      dark: { bg: '#0B0A09', surface: '#191715', ink: '#F2EEE8', ink2: '#C9C2B8', muted: '#9A9289', faint: '#7A7269', rule: '#2C2926', track: '#2A2420', trackB: '#1C2A22', focus: '#FF6A2B', focusT: '#FF8A5B', brk: '#3FA66A', brkT: '#6CC892', onBrk: '#0B0A09', btn: '#F2EEE8', onBtn: '#0B0A09', chip: '#221F1C', scrim: 'rgba(0,0,0,0.6)', breakBg: '#173D28', accentSoft: '#B93C0A' }
    };
    return { c: T[this.props.theme === 'dark' ? 'dark' : 'light'] };
  }
}
</script>
</body>
</html>
