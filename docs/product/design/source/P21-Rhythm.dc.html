<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rhythm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 24px 28px; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column">
  <button type="button" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; border: none; background: transparent; color: {{c.ink}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
  <h1 style="margin: 8px 0 0; font-size: 36px; font-weight: 600; letter-spacing: -0.03em">Rhythm</h1>

  <div role="radiogroup" aria-label="Preset" style="margin-top: 20px; border-top: 1.5px solid {{c.ink}}">
    <button type="button" aria-pressed="true" style="width: 100%; min-height: 64px; padding: 0; border: none; border-bottom: 1px solid {{c.rule}}; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; font-family: inherit; color: {{c.ink}}"><span style="width: 20px; height: 20px; border-radius: 10px; border: 6px solid {{c.ink}}; box-sizing: border-box; flex-shrink: 0"></span><span style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600">Classic</span><span style="font-size: 14px; color: {{c.ink2}}">25 focus · 5 break · 4 rounds</span></span></button>
    <button type="button" aria-pressed="false" style="width: 100%; min-height: 64px; padding: 0; border: none; border-bottom: 1px solid {{c.rule}}; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; font-family: inherit; color: {{c.ink}}"><span style="width: 20px; height: 20px; border-radius: 10px; border: 1.5px solid {{c.faint}}; box-sizing: border-box; flex-shrink: 0"></span><span style="display: flex; flex-direction: column"><span style="font-size: 17px">Gentle start</span><span style="font-size: 14px; color: {{c.ink2}}">15 focus · 5 break · good for hard days</span></span></button>
    <button type="button" aria-pressed="false" style="width: 100%; min-height: 64px; padding: 0; border: none; border-bottom: 1px solid {{c.rule}}; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; font-family: inherit; color: {{c.ink}}"><span style="width: 20px; height: 20px; border-radius: 10px; border: 1.5px solid {{c.faint}}; box-sizing: border-box; flex-shrink: 0"></span><span style="display: flex; flex-direction: column"><span style="font-size: 17px">Deep work</span><span style="font-size: 14px; color: {{c.ink2}}">50 focus · 10 break · 3 rounds</span></span></button>
    <button type="button" aria-pressed="false" style="width: 100%; min-height: 64px; padding: 0; border: none; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; font-family: inherit; color: {{c.ink}}"><span style="width: 20px; height: 20px; border-radius: 10px; border: 1.5px solid {{c.faint}}; box-sizing: border-box; flex-shrink: 0"></span><span style="font-size: 17px">Custom</span></button>
  </div>

  <div style="margin-top: 28px; font-size: 13px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: {{c.muted}}">Fine-tune</div>
  <div style="margin-top: 8px; border-top: 1.5px solid {{c.ink}}">
    <div style="min-height: 60px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid {{c.rule}}; font-size: 16px"><span>Focus</span><span style="display: flex; align-items: center; gap: 4px"><button type="button" aria-label="Shorter" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.rule}}; background: transparent; color: {{c.ink}}; font-size: 20px">−</button><span style="width: 64px; text-align: center; font-weight: 600">25 min</span><button type="button" aria-label="Longer" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.rule}}; background: transparent; color: {{c.ink}}; font-size: 20px">+</button></span></div>
    <div style="min-height: 60px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid {{c.rule}}; font-size: 16px"><span>Break</span><span style="display: flex; align-items: center; gap: 4px"><button type="button" aria-label="Shorter" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.rule}}; background: transparent; color: {{c.ink}}; font-size: 20px">−</button><span style="width: 64px; text-align: center; font-weight: 600">5 min</span><button type="button" aria-label="Longer" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.rule}}; background: transparent; color: {{c.ink}}; font-size: 20px">+</button></span></div>
    <div style="min-height: 60px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid {{c.rule}}; font-size: 16px"><span>Long break</span><span style="display: flex; align-items: center; gap: 4px"><button type="button" aria-label="Shorter" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.rule}}; background: transparent; color: {{c.ink}}; font-size: 20px">−</button><span style="width: 64px; text-align: center; font-weight: 600">15 min</span><button type="button" aria-label="Longer" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.rule}}; background: transparent; color: {{c.ink}}; font-size: 20px">+</button></span></div>
    <div style="min-height: 60px; display: flex; align-items: center; justify-content: space-between; font-size: 16px"><span>Rounds per loop</span><span style="display: flex; align-items: center; gap: 4px"><button type="button" aria-label="Fewer" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.rule}}; background: transparent; color: {{c.ink}}; font-size: 20px">−</button><span style="width: 64px; text-align: center; font-weight: 600">4</span><button type="button" aria-label="More" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.rule}}; background: transparent; color: {{c.ink}}; font-size: 20px">+</button></span></div>
  </div>

  <div style="margin-top: auto">
    <div style="display: flex; gap: 3px; height: 10px" aria-hidden="true">
      <div style="flex-grow: 25; background: {{c.focus}}"></div><div style="flex-grow: 5; background: {{c.brk}}"></div><div style="flex-grow: 25; background: {{c.focus}}"></div><div style="flex-grow: 5; background: {{c.brk}}"></div><div style="flex-grow: 25; background: {{c.focus}}"></div><div style="flex-grow: 5; background: {{c.brk}}"></div><div style="flex-grow: 25; background: {{c.focus}}"></div><div style="flex-grow: 15; background: {{c.brk}}"></div>
    </div>
    <div style="margin-top: 8px; font-size: 14px; color: {{c.ink2}}">One loop = 2 h 10 min · 100 min of focus</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg: '#F6F3EE', surface: '#FFFFFF', ink: '#141210', ink2: '#4A443C', muted: '#6B645B', faint: '#8A8175', rule: '#DDD6CB', track: '#E9DFD3', trackB: '#D3E3D8', focus: '#D9480F', focusT: '#B93C0A', brk: '#2F7D4F', brkT: '#2F7D4F', onBrk: '#FFFFFF', btn: '#141210', onBtn: '#F6F3EE', chip: '#ECE5DA', scrim: 'rgba(20,18,16,0.45)', breakBg: '#2F7D4F', accentSoft: '#F0A27F' },
      dark: { bg: '#0B0A09', surface: '#191715', ink: '#F2EEE8', ink2: '#C9C2B8', muted: '#9A9289', faint: '#7A7269', rule: '#2C2926', track: '#2A2420', trackB: '#1C2A22', focus: '#FF6A2B', focusT: '#FF8A5B', brk: '#3FA66A', brkT: '#6CC892', onBrk: '#0B0A09', btn: '#F2EEE8', onBtn: '#0B0A09', chip: '#221F1C', scrim: 'rgba(0,0,0,0.6)', breakBg: '#173D28', accentSoft: '#B93C0A' }
    };
    return { c: T[this.props.theme === 'dark' ? 'dark' : 'light'] };
  }
}
</script>
</body>
</html>
