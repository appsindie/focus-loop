<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>End early</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 60px 24px 28px; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column; overflow: hidden">
  <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: {{c.focusT}}">Paused · Focus 2 of 4</div>
  <div style="margin-top: 80px; display: flex; align-items: baseline"><span style="font-size: 200px; line-height: 0.85; font-weight: 600; letter-spacing: -0.06em">13</span><span style="font-size: 56px; font-weight: 500; color: {{c.faint}}">:05</span></div>

  <div style="position: absolute; top: 0; left: 0; width: 390px; height: 844px; background: {{c.scrim}}; display: flex; flex-direction: column; justify-content: flex-end">
    <div role="dialog" aria-label="End this session?" style="padding: 28px 24px 32px; border-radius: 24px 24px 0 0; background: {{c.surface}}; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 22px; font-weight: 600">End this session?</div>
      <div style="font-size: 16px; line-height: 1.5; color: {{c.ink2}}">You focused 11 minutes. That still counts toward your week.</div>
      <button type="button" style="margin-top: 12px; height: 56px; border: none; border-radius: 28px; background: {{c.btn}}; color: {{c.onBtn}}; font-family: inherit; font-size: 17px; font-weight: 600">Keep going</button>
      <button type="button" style="height: 52px; border: 1.5px solid {{c.rule}}; border-radius: 26px; background: transparent; color: {{c.ink}}; font-family: inherit; font-size: 16px">End and save 11 min</button>
      <button type="button" style="height: 44px; border: none; background: transparent; color: {{c.muted}}; font-family: inherit; font-size: 15px">Discard this session</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg: '#F6F3EE', surface: '#FFFFFF', ink: '#141210', ink2: '#4A443C', muted: '#6B645B', faint: '#8A8175', rule: '#DDD6CB', track: '#E9DFD3', trackB: '#D3E3D8', focus: '#D9480F', focusT: '#B93C0A', brk: '#2F7D4F', brkT: '#2F7D4F', onBrk: '#FFFFFF', btn: '#141210', onBtn: '#F6F3EE', chip: '#ECE5DA', scrim: 'rgba(20,18,16,0.45)', breakBg: '#2F7D4F', accentSoft: '#F0A27F' },
      dark: { bg: '#0B0A09', surface: '#191715', ink: '#F2EEE8', ink2: '#C9C2B8', muted: '#9A9289', faint: '#7A7269', rule: '#2C2926', track: '#2A2420', trackB: '#1C2A22', focus: '#FF6A2B', focusT: '#FF8A5B', brk: '#3FA66A', brkT: '#6CC892', onBrk: '#0B0A09', btn: '#F2EEE8', onBtn: '#0B0A09', chip: '#221F1C', scrim: 'rgba(0,0,0,0.6)', breakBg: '#173D28', accentSoft: '#B93C0A' }
    };
    return { c: T[this.props.theme === 'dark' ? 'dark' : 'light'] };
  }
}
</script>
</body>
</html>
