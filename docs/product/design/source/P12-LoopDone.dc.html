<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loop complete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 24px 28px; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column">
  <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: {{c.brkT}}">Loop complete</div>
  <h1 style="margin: 16px 0 0; font-size: 44px; line-height: 1; font-weight: 600; letter-spacing: -0.03em">100 minutes<br><span style="color: {{c.faint}}">of real focus.</span></h1>

  <div style="margin-top: 28px; display: flex; gap: 3px; height: 14px" aria-hidden="true">
    <div style="flex-grow: 25; background: {{c.focus}}"></div><div style="flex-grow: 5; background: {{c.brk}}"></div>
    <div style="flex-grow: 25; background: {{c.focus}}"></div><div style="flex-grow: 5; background: {{c.brk}}"></div>
    <div style="flex-grow: 25; background: {{c.focus}}"></div><div style="flex-grow: 5; background: {{c.brk}}"></div>
    <div style="flex-grow: 25; background: {{c.focus}}"></div><div style="flex-grow: 15; background: {{c.trackB}}"></div>
  </div>

  <div style="margin-top: 28px; border-top: 1.5px solid {{c.ink}}">
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; min-height: 52px; border-bottom: 1px solid {{c.rule}}"><span style="font-family: 'Newsreader', Georgia, serif; font-size: 19px">Reply to Lan’s email</span><span style="font-size: 14px; color: {{c.brkT}}; font-weight: 600">Finished</span></div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; min-height: 52px; border-bottom: 1px solid {{c.rule}}"><span style="font-family: 'Newsreader', Georgia, serif; font-size: 19px">Draft the intro for the Q4 report</span><span style="font-size: 14px; color: {{c.ink2}}">Moved forward</span></div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; min-height: 52px; border-bottom: 1px solid {{c.rule}}"><span style="font-family: 'Newsreader', Georgia, serif; font-size: 19px">Draft the intro for the Q4 report</span><span style="font-size: 14px; color: {{c.brkT}}; font-weight: 600">Finished</span></div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; min-height: 52px"><span style="font-family: 'Newsreader', Georgia, serif; font-size: 19px; color: {{c.muted}}; font-style: italic">No note</span><span style="font-size: 14px; color: {{c.ink2}}">Moved forward</span></div>
  </div>

  <div style="margin-top: 20px; font-size: 15px; line-height: 1.5; color: {{c.ink2}}">4 focus days this week. That’s your goal.</div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 64px; border: none; border-radius: 32px; background: {{c.brk}}; color: {{c.onBrk}}; font-family: inherit; font-size: 19px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; padding: 0 26px"><span>Long break</span><span style="font-weight: 500">15:00</span></button>
    <button type="button" style="height: 52px; border-radius: 26px; border: 1.5px solid {{c.ink}}; background: transparent; color: {{c.ink}}; font-family: inherit; font-size: 16px; font-weight: 600">Share my week</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg: '#F6F3EE', surface: '#FFFFFF', ink: '#141210', ink2: '#4A443C', muted: '#6B645B', faint: '#8A8175', rule: '#DDD6CB', track: '#E9DFD3', trackB: '#D3E3D8', focus: '#D9480F', focusT: '#B93C0A', brk: '#2F7D4F', brkT: '#2F7D4F', onBrk: '#FFFFFF', btn: '#141210', onBtn: '#F6F3EE', chip: '#ECE5DA', scrim: 'rgba(20,18,16,0.45)', breakBg: '#2F7D4F', accentSoft: '#F0A27F' },
      dark: { bg: '#0B0A09', surface: '#191715', ink: '#F2EEE8', ink2: '#C9C2B8', muted: '#9A9289', faint: '#7A7269', rule: '#2C2926', track: '#2A2420', trackB: '#1C2A22', focus: '#FF6A2B', focusT: '#FF8A5B', brk: '#3FA66A', brkT: '#6CC892', onBrk: '#0B0A09', btn: '#F2EEE8', onBtn: '#0B0A09', chip: '#221F1C', scrim: 'rgba(0,0,0,0.6)', breakBg: '#173D28', accentSoft: '#B93C0A' }
    };
    return { c: T[this.props.theme === 'dark' ? 'dark' : 'light'] };
  }
}
</script>
</body>
</html>
