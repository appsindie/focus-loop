<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Loop — Break</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#E3F1E7}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 24px 32px; background: #2F7D4F; color: #FFFFFF; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase">
    <div>Break</div>
    <div style="color: #CFE5D7">Focus 2 done</div>
  </div>

  <div style="margin-top: 64px; font-size: 240px; line-height: 0.82; font-weight: 600; letter-spacing: -0.06em">4</div>
  <div style="margin-top: 18px; font-size: 20px; font-weight: 500; color: #E3F1E7">minutes, then Focus 3</div>

  <div style="margin-top: 48px; border-top: 1.5px solid #FFFFFF">
    <div style="height: 48px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.28); font-size: 17px">Stand up, stretch your back</div>
    <div style="height: 48px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.28); font-size: 17px">Refill your water</div>
    <div style="height: 48px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.28); font-size: 17px">Look at something far away</div>
  </div>

  <label style="margin-top: 20px; min-height: 48px; display: flex; align-items: center; justify-content: space-between; font-size: 16px">
    Start Focus 3 automatically
    <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #141210">
  </label>

  <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 2fr; gap: 12px">
    <button type="button" style="height: 56px; border-radius: 4px; border: 1.5px solid #FFFFFF; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600">+5 min</button>
    <button type="button" style="height: 56px; border-radius: 4px; border: none; background: #FFFFFF; color: #1F5A37; font-family: inherit; font-size: 17px; font-weight: 600">Start Focus 3 now</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
