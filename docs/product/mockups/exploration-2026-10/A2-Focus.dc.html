<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Loop — Focus running</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141210}a:hover{color:#D9480F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 24px 32px; background: #F6F3EE; color: #141210; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase">
    <div style="color: #B93C0A">Focus 2 / 4</div>
    <div style="color: #6B645B">Ends 14:51</div>
  </div>

  <button type="button" aria-label="18 minutes 42 seconds left. Tap to toggle seconds." style="margin-top: 64px; padding: 0; border: none; background: transparent; text-align: left; color: #141210; font-family: inherit">
    <div style="font-size: 240px; line-height: 0.82; font-weight: 600; letter-spacing: -0.06em">18</div>
    <div style="margin-top: 18px; font-size: 20px; font-weight: 500; color: #4A443C">minutes left</div>
  </button>

  <div style="margin-top: 72px">
    <div style="display: flex; gap: 3px; height: 14px" aria-hidden="true">
      <div style="flex-grow: 25; background: #D9480F"></div>
      <div style="flex-grow: 5; background: #2F7D4F"></div>
      <div style="flex-grow: 25; background: #E9DFD3; position: relative"><div style="width: 25%; height: 14px; background: #D9480F"></div></div>
      <div style="flex-grow: 5; background: #D3E3D8"></div>
      <div style="flex-grow: 25; background: #E9DFD3"></div>
      <div style="flex-grow: 5; background: #D3E3D8"></div>
      <div style="flex-grow: 25; background: #E9DFD3"></div>
      <div style="flex-grow: 15; background: #D3E3D8"></div>
    </div>
    <div style="margin-top: 10px; display: flex; justify-content: space-between; font-size: 13px; color: #6B645B"><span>Next: 5 min break</span><span>Loop ends 16:30</span></div>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <button type="button" style="height: 56px; border-radius: 4px; border: 1.5px solid #141210; background: transparent; color: #141210; font-family: inherit; font-size: 17px; font-weight: 600">Pause</button>
    <button type="button" style="height: 56px; border-radius: 4px; border: none; background: transparent; color: #6B645B; font-family: inherit; font-size: 17px; font-weight: 500">End early…</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
