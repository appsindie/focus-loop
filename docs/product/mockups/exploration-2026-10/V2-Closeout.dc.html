<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141210}a:hover{color:#B93C0A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 24px 28px; background: #F6F3EE; color: #141210; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column">
  <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #B93C0A">Focus 2 done · 25 min</div>
  <div style="margin-top: 10px; font-family: 'Newsreader', Georgia, serif; font-size: 22px; line-height: 1.2; color: #4A443C">Draft the intro for the Q4 report</div>
  <h1 style="margin: 28px 0 0; font-size: 38px; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em">How did it go?</h1>

  <div role="radiogroup" aria-label="Outcome" style="margin-top: 18px; border-top: 1.5px solid #141210">
    <button type="button" aria-pressed="false" style="width: 100%; min-height: 60px; padding: 0; border: none; border-bottom: 1px solid #DDD6CB; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; font-family: inherit; color: #141210"><span style="width: 20px; height: 20px; border-radius: 10px; border: 1.5px solid #8A8175; box-sizing: border-box"></span><span style="font-size: 18px">Finished it</span></button>
    <button type="button" aria-pressed="true" style="width: 100%; min-height: 60px; padding: 0; border: none; border-bottom: 1px solid #DDD6CB; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; font-family: inherit; color: #141210"><span style="width: 20px; height: 20px; border-radius: 10px; border: 6px solid #141210; box-sizing: border-box"></span><span style="font-size: 18px; font-weight: 600">Moved it forward</span></button>
    <button type="button" aria-pressed="false" style="width: 100%; min-height: 60px; padding: 0; border: none; border-bottom: 1px solid #DDD6CB; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; font-family: inherit; color: #141210"><span style="width: 20px; height: 20px; border-radius: 10px; border: 1.5px solid #8A8175; box-sizing: border-box"></span><span style="font-size: 18px">Got stuck</span><span style="margin-left: auto; font-size: 14px; color: #6B645B">still counts</span></button>
  </div>

  <div style="margin-top: 20px; font-size: 15px; line-height: 1.5; color: #4A443C">1 parked thought waits for you on Home.</div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <label style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; font-size: 16px">Start break automatically next time<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #2F7D4F"></label>
    <button type="button" style="height: 64px; border: none; border-radius: 32px; background: #2F7D4F; color: #FFFFFF; font-family: inherit; font-size: 19px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; padding: 0 26px"><span>Start break</span><span style="font-weight: 500; color: #CFE5D7">5:00</span></button>
    <button type="button" style="height: 48px; border: none; background: transparent; color: #4A443C; font-family: inherit; font-size: 16px">Keep going, 10 more minutes</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}

</body>
</html>
