    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><div style="width: 100%; height: 4px; background: #DDD6CB"></div><span style="font-size: 13px; color: #4A443C">F</span></div>

    <button type="button" style="height: 56px; border: none; border-radius: 28px; background: #141210; color: #F6F3EE; font-family: inherit; font-size: 17px; font-weight: 600">Share my week</button>
