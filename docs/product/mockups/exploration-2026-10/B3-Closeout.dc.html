</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Host+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141210}a:hover{color:#B93C0A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 28px 24px; background: #F4EFE6; color: #141210; font-family: 'Host Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="font-size: 14px; color: #6B645B">25 minutes on</div>
  <div style="margin-top: 4px; font-family: 'Newsreader', Georgia, serif; font-size: 22px; line-height: 1.2; color: #4A443C">Draft the intro for the Q4 report</div>
  <h1 style="margin: 32px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 40px; line-height: 1.05">How did it go?</h1>

  <div role="radiogroup" aria-label="Outcome" style="margin-top: 20px; border-top: 1.5px solid #141210">
    <button type="button" aria-pressed="false" style="width: 100%; min-height: 64px; padding: 0; border: none; border-bottom: 1px solid #DDD3C4; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; font-family: inherit; color: #141210"><span style="width: 20px; height: 20px; border-radius: 10px; border: 1.5px solid #8A8175; box-sizing: border-box"></span><span style="font-size: 18px">Finished it</span></button>
    <button type="button" aria-pressed="true" style="width: 100%; min-height: 64px; padding: 0; border: none; border-bottom: 1px solid #DDD3C4; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; font-family: inherit; color: #141210"><span style="width: 20px; height: 20px; border-radius: 10px; border: 6px solid #141210; box-sizing: border-box"></span><span style="font-size: 18px; font-weight: 600">Moved it forward</span></button>
    <button type="button" aria-pressed="false" style="width: 100%; min-height: 64px; padding: 0; border: none; border-bottom: 1px solid #DDD3C4; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; font-family: inherit; color: #141210"><span style="width: 20px; height: 20px; border-radius: 10px; border: 1.5px solid #8A8175; box-sizing: border-box"></span><span style="font-size: 18px">Got stuck</span><span style="margin-left: auto; font-size: 14px; color: #6B645B">still counts</span></button>
  </div>

  <div style="margin-top: 28px; font-size: 15px; line-height: 1.5; color: #4A443C">2 parked thoughts will wait at the top of your next session.</div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 60px; border: none; border-radius: 30px; background: #141210; color: #F4EFE6; font-family: inherit; font-size: 18px; font-weight: 600">Take a 5 minute break</button>
    <button type="button" style="height: 52px; border-radius: 26px; border: 1.5px solid #141210; background: transparent; color: #141210; font-family: inherit; font-size: 16px; font-weight: 600">Keep going, 10 more</button>
  </div>
</div>
</x-dc>
