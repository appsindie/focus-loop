<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First launch — choose display</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141210}a:hover{color:#B93C0A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 72px 24px 32px; background: #F6F3EE; color: #141210; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column">
  <div style="font-size: 15px; font-weight: 600">Focus Loop</div>
  <h1 style="margin: 20px 0 0; font-size: 38px; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em">How do you read time best?</h1>
  <p style="margin: 12px 0 0; font-size: 16px; line-height: 1.5; color: #4A443C">Tap one to start your first 25 minutes. You can switch anytime.</p>

  <button type="button" style="margin-top: 28px; height: 220px; padding: 20px; border: 1.5px solid #141210; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; gap: 20px; text-align: left; font-family: inherit; color: #141210">
    <div style="width: 120px; height: 120px; flex-shrink: 0; border-radius: 60px; background: conic-gradient(#D9480F 0deg 270deg, #E9DFD3 270deg 360deg)" aria-hidden="true"></div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 22px; font-weight: 600">See it</div>
      <div style="font-size: 15px; line-height: 1.45; color: #4A443C">A disc that shrinks. No ticking seconds.</div>
    </div>
  </button>

  <button type="button" style="margin-top: 14px; height: 220px; padding: 20px; border: 1px solid #DDD6CB; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; gap: 20px; text-align: left; font-family: inherit; color: #141210">
    <div style="width: 120px; flex-shrink: 0; font-size: 64px; line-height: 1; font-weight: 600; letter-spacing: -0.05em" aria-hidden="true">25<span style="font-size: 26px; color: #A39B90">:00</span></div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 22px; font-weight: 600">Read it</div>
      <div style="font-size: 15px; line-height: 1.45; color: #4A443C">Big, exact numbers.</div>
    </div>
  </button>

  <div style="margin-top: auto; font-size: 14px; line-height: 1.5; color: #6B645B; text-align: center">No account. Your sessions stay on this phone.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
