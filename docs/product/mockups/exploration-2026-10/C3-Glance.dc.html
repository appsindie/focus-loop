<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visual Time — Lock screen and widget</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8A5B}a:hover{color:#FFB08F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 72px 20px 32px; background: #000000; color: #F2EFEA; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column; align-items: center">
  <div style="font-size: 17px; color: #C9C4BD">Thursday 2 October</div>
  <div style="font-size: 92px; font-weight: 600; letter-spacing: -0.04em; line-height: 1">14:32</div>

  <div style="margin-top: 28px; width: 100%; box-sizing: border-box; padding: 16px; border-radius: 24px; background: #121212; display: flex; align-items: center; gap: 16px">
    <div style="width: 56px; height: 56px; border-radius: 28px; background: conic-gradient(#FF6A2B 0deg 112deg, #2A2724 112deg 360deg)" aria-hidden="true"></div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 17px; font-weight: 600">Focus, about 18 min left</div>
      <div style="font-size: 14px; color: #8E8A85">Break at 14:51</div>
    </div>
  </div>
  <div style="margin-top: 8px; align-self: flex-start; font-size: 13px; color: #6F6A64">Live Activity</div>

  <div style="margin-top: 40px; width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
    <div style="aspect-ratio: 1; box-sizing: border-box; padding: 16px; border-radius: 26px; background: #121212; display: flex; flex-direction: column; justify-content: space-between">
      <div style="width: 60px; height: 60px; border-radius: 30px; background: conic-gradient(#FF6A2B 0deg 150deg, #2A2724 150deg 360deg)" aria-hidden="true"></div>
      <a href="#" style="height: 44px; border-radius: 22px; background: #FF6A2B; color: #000000; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Focus 25</a>
    </div>
    <div style="aspect-ratio: 1; box-sizing: border-box; padding: 16px; border-radius: 26px; background: #121212; display: flex; flex-direction: column; justify-content: space-between">
      <div style="font-size: 13px; color: #8E8A85">This week</div>
      <div style="display: flex; align-items: flex-end; gap: 7px; height: 64px" aria-label="Focused 4 of 7 days">
        <div style="width: 13px; height: 36px; border-radius: 3px; background: #FF6A2B"></div>
        <div style="width: 13px; height: 60px; border-radius: 3px; background: #FF6A2B"></div>
        <div style="width: 13px; height: 16px; border-radius: 3px; background: #FF6A2B"></div>
        <div style="width: 13px; height: 48px; border-radius: 3px; background: #FF6A2B"></div>
        <div style="width: 13px; height: 4px; border-radius: 2px; background: #2A2724"></div>
        <div style="width: 13px; height: 4px; border-radius: 2px; background: #2A2724"></div>
        <div style="width: 13px; height: 4px; border-radius: 2px; background: #2A2724"></div>
      </div>
      <div style="font-size: 15px; font-weight: 600">4 days focused</div>
    </div>
  </div>
  <div style="margin-top: 8px; align-self: flex-start; font-size: 13px; color: #6F6A64">Home-screen widgets</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</script>

</html>
