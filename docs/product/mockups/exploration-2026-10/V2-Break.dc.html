<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#E3F1E7}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 24px 28px; background: #2F7D4F; color: #FFFFFF; font-family: 'Host Grotesk', system-ui, sans-serif; font-feature-settings: 'tnum'; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase">
    <div>Break</div>
    <div style="color: #CFE5D7">then Focus 3</div>
  </div>

  <div style="margin-top: 56px; display: flex; align-items: baseline">
    <span style="font-size: 200px; line-height: 0.85; font-weight: 600; letter-spacing: -0.06em">3</span>
    <span style="font-size: 56px; font-weight: 500; color: #A8D1B6">:48</span>
  </div>
  <div style="margin-top: 12px; font-size: 17px; color: #E3F1E7">minutes of rest</div>

  <div style="margin-top: 44px; font-size: 13px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #CFE5D7">Off the screen</div>
  <div style="margin-top: 8px; border-top: 1.5px solid #FFFFFF">
    <div style="height: 48px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.28); font-size: 17px">Stand up, stretch your back</div>
    <div style="height: 48px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.28); font-size: 17px">Refill your water</div>
    <div style="height: 48px; display: flex; align-items: center; font-size: 17px">Look at something far away</div>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 2fr; gap: 12px">
    <button type="button" style="height: 56px; border-radius: 28px; border: 1.5px solid #FFFFFF; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600">+5 min</button>
    <button type="button" style="height: 56px; border-radius: 28px; border: none; background: #FFFFFF; color: #1F5A37; font-family: inherit; font-size: 17px; font-weight: 600">Focus 3 now</button>
  </div>
</div>
</x-dc>
