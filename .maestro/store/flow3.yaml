appId: com.appsindie.focusloop
---
# From Home: start focus, relaunch for WelcomeBack, then break, week, share.
- extendedWaitUntil:
    visible: "Start"
    timeout: 10000
- tapOn: "Start"
- extendedWaitUntil:
    visible: "End early…"
    timeout: 8000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Skip to break"
    timeout: 10000
- takeScreenshot: 04-welcome-back
- tapOn: "Skip to break"
- extendedWaitUntil:
    visible: "+5 min"
    timeout: 8000
- takeScreenshot: 02-break
- tapOn: "Focus 1 now"
- extendedWaitUntil:
    visible: "End early…"
    timeout: 8000
- tapOn: "End early…"
- tapOn:
    point: "50%,84%"
- extendedWaitUntil:
    visible: "Start"
    timeout: 10000
- tapOn: "Open week and history"
- extendedWaitUntil:
    visible: "Share my week"
    timeout: 8000
- takeScreenshot: 03-week
- tapOn: "Share my week"
- takeScreenshot: 06-share
- tapOn: "Back"
- tapOn: "Back to home"
