appId: com.appsindie.focusloop
---
# Continue from the open end-early sheet (05 capture, then save via point tap).
- takeScreenshot: 05-end-early
- tapOn:
    point: "50%,86%"
- extendedWaitUntil:
    visible: "Start break"
    timeout: 8000
- tapOn: "Start break"
- extendedWaitUntil:
    visible: "Focus 2 now"
    timeout: 8000
- takeScreenshot: 02-break
- tapOn: "Focus 2 now"
- extendedWaitUntil:
    visible: "End early…"
    timeout: 8000
- tapOn: "End early…"
- tapOn:
    point: "50%,86%"
- extendedWaitUntil:
    visible: "Done for now"
    timeout: 8000
- tapOn: "Done for now"
- extendedWaitUntil:
    visible: "Open week and history"
    timeout: 8000
- tapOn: "Open week and history"
- extendedWaitUntil:
    visible: "Share my week"
    timeout: 8000
- takeScreenshot: 03-week
- tapOn: "Share my week"
- takeScreenshot: 06-share
- tapOn: "Back"
- tapOn: "Back to home"
- tapOn: "Start"
- extendedWaitUntil:
    visible: "End early…"
    timeout: 8000
- stopApp
- launchApp
- takeScreenshot: 04-welcome-back
