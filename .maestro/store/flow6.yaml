appId: com.appsindie.focusloop
---
# App is on a running focus screen. Relaunch → WelcomeBack(04) → break(02) → focus → save → Home → week(03) → share(06).
- extendedWaitUntil:
    visible: "End early…"
    timeout: 8000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Skip to break"
    timeout: 10000
- takeScreenshot: 04-welcome-back
- tapOn: "Skip to break"
- extendedWaitUntil:
    visible: "Focus 1 now"
    timeout: 8000
- takeScreenshot: 02-break
- tapOn: "Focus 1 now"
- extendedWaitUntil:
    visible: "End early…"
    timeout: 8000
- tapOn: "End early…"
- tapOn:
    point: "50%,84%"
- extendedWaitUntil:
    visible: "Open week and history"
    timeout: 10000
- tapOn: "Open week and history"
- extendedWaitUntil:
    visible: "Share my week"
    timeout: 8000
- takeScreenshot: 03-week
- tapOn: "Share my week"
- takeScreenshot: 06-share
- tapOn: "Back"
- tapOn: "Back to home"
