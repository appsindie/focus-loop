appId: com.appsindie.focusloop
---
# On break screen → 02-break → Focus 2 → end early → save → home → week(03) → share(06)
- takeScreenshot: 02-break
- tapOn: "Focus 2 now"
- extendedWaitUntil:
    visible: "End early…"
    timeout: 8000
- tapOn: "End early…"
- tapOn:
    point: "50%,84%"
- extendedWaitUntil:
    visible: "Open week and history"
    timeout: 10000
- tapOn: "Open week and history"
- extendedWaitUntil:
    visible: "Share my week"
    timeout: 8000
- takeScreenshot: 03-week
- tapOn: "Share my week"
- takeScreenshot: 06-share
- tapOn: "Back"
- tapOn: "Back to home"
