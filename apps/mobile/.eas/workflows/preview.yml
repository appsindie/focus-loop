name: Preview / SIT

on:
  push:
    branches:
      - "preview/*"
      - "sit/*"
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options:
          - all
          - android
          - ios
        default: all
        description: "Platform to build for preview"
      notes:
        type: string
        description: "Preview notes / changelog"
        required: false

defaults:
  hooks:
    after_checkout:
      - name: Write store credentials
        run: bash scripts/write-store-credentials.sh

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint

  get_android_build:
    name: Check for existing Android preview build
    needs: [fingerprint]
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android' }}
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: preview

  get_ios_build:
    name: Check for existing iOS preview build
    needs: [fingerprint]
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: preview

  build_android:
    name: Build Android preview
    after: [get_android_build]
    if: ${{ (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android') && after.get_android_build.status == 'success' && !after.get_android_build.outputs.build_id }}
    type: build
    hooks:
      before_install_node_modules:
        - name: Set version from branch
          run: node scripts/set-version-from-branch.js
        - name: Write store credentials
          run: bash scripts/write-store-credentials.sh
    params:
      platform: android
      profile: preview
      message: ${{ inputs.notes || github.ref_name }}

  build_ios:
    name: Build iOS preview
    after: [get_ios_build]
    if: ${{ (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios') && after.get_ios_build.status == 'success' && !after.get_ios_build.outputs.build_id }}
    type: build
    hooks:
      before_install_node_modules:
        - name: Set version from branch
          run: node scripts/set-version-from-branch.js
        - name: Write store credentials
          run: bash scripts/write-store-credentials.sh
    params:
      platform: ios
      profile: preview
      message: ${{ inputs.notes || github.ref_name }}

  submit_android:
    name: Submit Android to internal track
    after: [get_android_build, build_android]
    if: ${{ (after.get_android_build.status == 'success' && after.get_android_build.outputs.build_id) || (after.build_android.status == 'success' && after.build_android.outputs.build_id) }}
    type: submit
    environment: preview
    params:
      build_id: ${{ after.get_android_build.outputs.build_id || after.build_android.outputs.build_id }}
      profile: preview

  submit_ios:
    name: Submit iOS to TestFlight preview group
    after: [get_ios_build, build_ios]
    if: ${{ (after.get_ios_build.status == 'success' && after.get_ios_build.outputs.build_id) || (after.build_ios.status == 'success' && after.build_ios.outputs.build_id) }}
    type: submit
    environment: preview
    params:
      build_id: ${{ after.get_ios_build.outputs.build_id || after.build_ios.outputs.build_id }}
      profile: preview
