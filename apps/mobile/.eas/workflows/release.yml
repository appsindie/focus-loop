name: Release / Internal Testing

# No push trigger: every build and every submission is a separate confirmed
# human go-ahead (release skill). Trigger manually via `eas workflow:run` or
# the EAS dashboard, or run `eas build`/`eas submit` directly per confirmation.
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options:
          - all
          - android
          - ios
        default: all
        description: "Platform to build for internal release"
      notes:
        type: string
        description: "Release notes / changelog"
        required: false

defaults:
  hooks:
    after_checkout:
      - name: Write store credentials
        run: bash scripts/write-store-credentials.sh

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint

  get_android_build:
    name: Check for existing Android production build
    needs: [fingerprint]
    if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: production

  get_ios_build:
    name: Check for existing iOS production build
    needs: [fingerprint]
    if: ${{ inputs.platform == 'all' || inputs.platform == 'ios' }}
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production

  build_android:
    name: Build Android production
    after: [get_android_build]
    if: ${{ (inputs.platform == 'all' || inputs.platform == 'android') && after.get_android_build.status == 'success' && !after.get_android_build.outputs.build_id }}
    type: build
    hooks:
      before_install_node_modules:
        - name: Set version from branch
          run: node scripts/set-version-from-branch.js
        - name: Write store credentials
          run: bash scripts/write-store-credentials.sh
    params:
      platform: android
      profile: production
      message: ${{ inputs.notes || github.ref_name }}

  build_ios:
    name: Build iOS production
    after: [get_ios_build]
    if: ${{ (inputs.platform == 'all' || inputs.platform == 'ios') && after.get_ios_build.status == 'success' && !after.get_ios_build.outputs.build_id }}
    type: build
    hooks:
      before_install_node_modules:
        - name: Set version from branch
          run: node scripts/set-version-from-branch.js
        - name: Write store credentials
          run: bash scripts/write-store-credentials.sh
    params:
      platform: ios
      profile: production
      message: ${{ inputs.notes || github.ref_name }}

  submit_android:
    name: Submit Android to internal track
    after: [get_android_build, build_android]
    if: ${{ (after.get_android_build.status == 'success' && after.get_android_build.outputs.build_id) || (after.build_android.status == 'success' && after.build_android.outputs.build_id) }}
    type: submit
    environment: production
    params:
      build_id: ${{ after.get_android_build.outputs.build_id || after.build_android.outputs.build_id }}
      profile: internal

  submit_ios:
    name: Submit iOS to TestFlight internal
    after: [get_ios_build, build_ios]
    if: ${{ (after.get_ios_build.status == 'success' && after.get_ios_build.outputs.build_id) || (after.build_ios.status == 'success' && after.build_ios.outputs.build_id) }}
    type: submit
    environment: production
    params:
      build_id: ${{ after.get_ios_build.outputs.build_id || after.build_ios.outputs.build_id }}
      profile: internal
